<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Новогодний эфир «Вместе радио». 16 декабря, с 10:00 до 16:00 по московскому времени.">
  <meta name="theme-color" content="#e7effc">
  <title>Новогодний эфир «Вместе радио»</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="broadcast">
    <picture class="broadcast__decoration">
      <source media="(max-width: 640px), (orientation: portrait)" srcset="assets/decor-mobile.webp">
      <img src="assets/decor-desktop.webp" width="1920" height="1080" alt="" fetchpriority="high">
    </picture>
    <img class="broadcast__radio" src="assets/radio.webp" width="1317" height="1464" alt="">
    <img class="broadcast__ornament" src="assets/ball.webp" width="504" height="574" alt="">

    <h1 class="broadcast__title">
      <picture>
        <source media="(max-width: 640px), (orientation: portrait)" srcset="assets/title-mobile.png">
        <img src="assets/title-desktop.png" width="2008" height="412" alt="Новогодний эфир «Вместе радио»">
      </picture>
    </h1>

    <p class="broadcast__schedule">
      <picture>
        <source media="(max-width: 640px), (orientation: portrait)" srcset="assets/date-mobile.png">
        <img src="assets/date-desktop.png" width="1582" height="197" alt="16 декабря, с 10:00 до 16:00 МСК">
      </picture>
    </p>

    <p class="broadcast__invitation">
      <picture>
        <source media="(max-width: 640px), (orientation: portrait)" srcset="assets/cta-mobile.png">
        <img src="assets/cta-desktop.png" width="1522" height="266" alt="Подключайтесь, слушайте, участвуйте и выигрывайте подарки!">
      </picture>
    </p>
  </main>
</body>
</html>
